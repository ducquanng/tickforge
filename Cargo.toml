[package]
name = "tickforge_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust core for tickforge: tick aggregation, L2 order book, tick-level backtest engine"

[lib]
name = "tickforge_core"
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29.3", features = ["abi3-py310"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
